name: Sync Session Rooms & Feed

on:
  # Descomentar el bloque schedule cuando se decida automatizar en main:
  # schedule:
  #   # Jueves (renovación masiva semanal): 00:00, 08:00 y 14:00 CDMX (06:00, 14:00 y 20:00 UTC)
  #   - cron: '0 6,14,20 * * 4'
  #   # Viernes a Miércoles (mantenimiento diario): 02:00 CDMX (08:00 UTC)
  #   - cron: '0 8 * * 0-3,5,6'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Forzar resolución de todas las sesiones (ignorar caché)'
        type: boolean
        default: false

concurrency:
  group: sync-rooms
  cancel-in-progress: false

jobs:
  sync-rooms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve rooms and upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: 'https://cinetk.jjsantosochoa.workers.dev'
        run: |
          FORCE_FLAG="${{ github.event.inputs.force_all == 'true' && '--force' || '' }}"
          node scripts/seed-rooms.mjs --upload-remote $FORCE_FLAG --notify-worker
