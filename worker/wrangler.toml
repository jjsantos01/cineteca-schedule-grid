name = "cinetk"
main = "cinetk.js"
compatibility_date = "2026-08-22"

[observability]
enabled = true

# Cloudflare R2 Storage Binding
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "cinetk-storage"
preview_bucket_name = "cinetk-storage-preview"

# Cron Trigger: Ejecuta cada 2 horas entre 8:00 AM y 10:00 PM CDMX (UTC-6 -> 14:00 a 04:00 UTC)
[triggers]
crons = ["0 0,2,4,14,16,18,20,22 * * *"]

